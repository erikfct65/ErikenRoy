name: Curaçao Deal Check

on:
  schedule:
    - cron: '0 10,15 * * *' # Draait om ~09:00 en ~17:00 Nederlandse zomertijd
  workflow_dispatch: # Zorgt dat je de knop "Run workflow" krijgt

jobs:
  check-deals:
    runs-on: ubuntu-latest
    steps:
      - name: Code ophalen
        uses: actions/checkout@v3

      - name: Python instellen
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Installeren tools
        run: |
          pip install playwright requests beautifulsoup4
          playwright install --with-deps chromium

      - name: Start de bot
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python curacao_bot.py
